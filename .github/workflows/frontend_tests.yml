name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      # Plural-fold cases shared with the backend (frontend/src/tests/unit/plurals.test.ts).
      - "backend/tests/fixtures/plural_fold_cases.json"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      # Plural-fold cases shared with the backend (frontend/src/tests/unit/plurals.test.ts).
      - "backend/tests/fixtures/plural_fold_cases.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Linting
        run: |
          cd frontend
          npm run lint

      - name: Type check
        run: |
          cd frontend
          npm run typecheck

      - name: Run Tests
        run: |
          cd frontend
          npm test

      # Placeholder Supabase env, as in playwright.analytics.config.ts: the build reads no database.
      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          PUBLIC_ENABLE_NOTIFICATIONS: "false"
          SUPABASE_SERVICE_KEY: placeholder-service-key

      # Fixture data, placeholder Supabase env, and off-origin requests aborted (playwright.analytics.config.ts).
      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run analytics E2E tests
        run: |
          cd frontend
          npm run test:e2e:analytics
