name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      # Plural-fold cases shared with the backend (frontend/src/tests/unit/plurals.test.ts).
      - "backend/tests/fixtures/plural_fold_cases.json"
      # The e2e run's local database: schema, seed and stack.
      - "backend/migrations/**"
      - "supabase/**"
      - ".github/actions/local-supabase/**"
      - ".github/workflows/frontend_tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      # Plural-fold cases shared with the backend (frontend/src/tests/unit/plurals.test.ts).
      - "backend/tests/fixtures/plural_fold_cases.json"
      # The e2e run's local database: schema, seed and stack.
      - "backend/migrations/**"
      - "supabase/**"
      - ".github/actions/local-supabase/**"
      - ".github/workflows/frontend_tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Linting
        run: |
          cd frontend
          npm run lint

      - name: Type check
        run: |
          cd frontend
          npm run typecheck

      - name: Run Tests
        run: |
          cd frontend
          npm run test:coverage

      # Placeholder Supabase env: the build reads no database.
      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          PUBLIC_ENABLE_NOTIFICATIONS: "false"
          SUPABASE_SERVICE_KEY: placeholder-service-key

      # Every migration plus supabase/seed.sql. No secrets in this job: nothing here may reach production.
      - name: Start local Supabase
        uses: ./.github/actions/local-supabase

      - name: Check generated database types
        run: |
          cd frontend
          npm run db:types
          git diff --exit-code -- src/lib/database.types.ts ||
            { echo "::error::src/lib/database.types.ts is stale: run npm run db:types and commit it."; exit 1; }

      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      # Against the local stack, reset to the seed by the global setup (playwright.config.ts).
      - name: Run E2E tests
        run: |
          cd frontend
          npm run test:e2e
