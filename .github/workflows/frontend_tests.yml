name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      # Plural-fold cases shared with the backend (frontend/src/tests/unit/plurals.test.ts).
      - "backend/tests/fixtures/plural_fold_cases.json"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      # Plural-fold cases shared with the backend (frontend/src/tests/unit/plurals.test.ts).
      - "backend/tests/fixtures/plural_fold_cases.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Linting
        run: |
          cd frontend
          npm run lint

      - name: Run Tests
        run: |
          cd frontend
          npm test
