name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "backend/.python-version"

      - name: Install dependencies
        run: |
          cd backend
          uv sync --locked --dev

      - name: Run Ruff Linter
        run: |
          cd backend
          uv run --locked ruff check .

      - name: Run Ruff Formatter Check
        run: |
          cd backend
          uv run --locked ruff format --check .

      - name: Run mypy Type Checker
        run: |
          cd backend
          uv run --locked mypy .

      - name: Run Tests with Coverage
        run: |
          cd backend
          uv run --locked coverage run -m unittest discover -s tests -p "test_*.py"
          uv run --locked coverage report

      - name: Build Coverage Report
        if: always()
        run: |
          cd backend
          # The floor is enforced by the step above; the report is wanted either way.
          uv run --locked coverage html --fail-under 0

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: backend/htmlcov
          if-no-files-found: ignore
