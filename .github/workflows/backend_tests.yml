name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'supabase/**'
      - '.github/actions/local-supabase/**'
      - '.github/workflows/backend_tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'supabase/**'
      - '.github/actions/local-supabase/**'
      - '.github/workflows/backend_tests.yml'

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "backend/.python-version"

      - name: Install dependencies
        run: |
          cd backend
          uv sync --locked --dev

      - name: Run Ruff Linter
        run: |
          cd backend
          uv run --locked ruff check .

      - name: Run Ruff Formatter Check
        run: |
          cd backend
          uv run --locked ruff format --check .

      - name: Run mypy Type Checker
        run: |
          cd backend
          uv run --locked mypy .

      - name: Run Import Contracts
        run: |
          cd backend
          uv run --locked lint-imports

      - name: Run Docstring Budget
        run: |
          cd backend
          uv run --locked python -m tools.lint.check_docstrings

      - name: Run Module Size Ratchet
        run: |
          cd backend
          uv run --locked python -m tools.lint.check_module_size

      - name: Run Symbol Reachability
        run: |
          cd backend
          uv run --locked python -m tools.lint.check_symbol_reachability

      - name: Run Tests with Coverage
        run: |
          cd backend
          uv run --locked coverage run -m unittest discover -s tests -p "test_*.py"
          uv run --locked coverage report

      - name: Build Coverage Report
        if: always()
        run: |
          cd backend
          # The floor is enforced by the step above; the report is wanted either way.
          uv run --locked coverage html --fail-under 0

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: backend/htmlcov
          if-no-files-found: ignore

  # The real-database suite, on a local Supabase stack built from the migrations.
  # No secrets: every URL and key comes from the local stack.
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "backend/.python-version"

      - name: Install dependencies
        run: |
          cd backend
          uv sync --locked --dev

      - name: Start local Supabase
        id: supabase
        uses: ./.github/actions/local-supabase

      - name: Run Database Tests
        env:
          TEST_SUPABASE_URL: ${{ steps.supabase.outputs.api-url }}
          TEST_SUPABASE_DB_URL: ${{ steps.supabase.outputs.db-url }}
          TEST_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon-key }}
          TEST_SUPABASE_SERVICE_KEY: ${{ steps.supabase.outputs.service-role-key }}
        run: |
          cd backend
          uv run --locked python -m unittest discover -s tests/db_integration -t .

      - name: Check Migrations Match the Production Schema
        run: |
          supabase db dump --local --workdir "$GITHUB_WORKSPACE" -f "$RUNNER_TEMP/schema-dump.sql"
          cd backend
          uv run --locked python -m tools.check_schema_snapshot "$RUNNER_TEMP/schema-dump.sql"
