[project]
name = "backend"
version = "0.1.0"
description = "An app that tracks Chicago alderman newsletters"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "cryptography>=50.0.0",
    "html2text>=2025.4.15",
    "imap-tools>=1.11.0",
    "ollama>=0.6.1",
    "openai>=1.82.0",
    "pydantic>=2.12.5",
    "pyjwt>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.1",
    "requests>=2.33.0",
    "resend>=2.19.0",
    "supabase>=2.27.0",
    "tzdata>=2025.3",
    "urllib3>=2.8.0",
]

[dependency-groups]
dev = [
    "coverage>=7.13.1",
    "mypy>=1.13.0",
    "pip-audit>=2.10.0",
    "ruff>=0.14.14,<0.15",
    "tiktoken>=0.12.0",
]

[tool.ruff]
# Pinned: an unbounded version lets two environments lint the same tree differently.
required-version = ">=0.14,<0.15"
target-version = "py313"
# line-length stays at the default 88: the formatter already owns it, and changing it reformats every file.

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
]
ignore = [
    "E501",    # the formatter owns line length; what remains is long strings and URLs
]

[tool.ruff.lint.isort]
known-first-party = ["analytics", "config", "ingest", "models", "notifications", "processing", "prompts", "shared", "tools", "utils"]
