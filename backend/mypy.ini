[mypy]
python_version = 3.13
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
# Stricter null handling - no implicit Optional
no_implicit_optional = true

# Pragmatic relaxation for decorators (Pydantic uses many)
allow_untyped_decorators = true

# Gradual adoption strategy
follow_imports = normal

# Tests and tools are checked too; only non-Python-source trees are excluded.
exclude = ^(migrations/|samples/|data/|\.venv/)
# Without these, tests/fixtures/mock_helpers.py is seen as both fixtures.mock_helpers
# and tests.fixtures.mock_helpers. A tests/__init__.py would instead change how
# `unittest discover -s tests` names modules.
explicit_package_bases = True
mypy_path = .

# Third-party libraries without stubs
# Note: Don't use ignore_missing_imports globally - only per-library
[mypy-supabase.*]
ignore_missing_imports = true

[mypy-resend.*]
ignore_missing_imports = true

[mypy-imap_tools.*]
ignore_missing_imports = true

[mypy-ollama.*]
ignore_missing_imports = true

[mypy-html2text.*]
ignore_missing_imports = true

[mypy-bs4.*]
ignore_missing_imports = true

[mypy-requests.*]
ignore_missing_imports = true

[mypy-dateutil.*]
ignore_missing_imports = true

# --- Not yet strict: the tests ratchet ---------------------------------
# One section per test module still failing a strict rule, naming the codes.
# ONLY SHRINKS: tests/unit/test_typing_ratchet.py counts modules and codes and
# checks each claim still fires. Fix the module, then delete its entry.
[mypy-tests.integration.test_notification_matching]
disable_error_code = arg-type

[mypy-tests.unit.test_email_parser]
disable_error_code = arg-type, index

[mypy-tests.unit.test_email_sender]
disable_error_code = arg-type

[mypy-tests.unit.test_models]
disable_error_code = arg-type, call-arg, union-attr

[mypy-tests.unit.test_newsletter_scraper]
disable_error_code = arg-type, index

[mypy-tests.unit.test_utils]
disable_error_code = arg-type
